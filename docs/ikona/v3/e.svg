 <g filter="url(#blur)" opacity=".55"><circle cx="330" cy="330" r="230" fill="#9AF0FF"/><circle cx="720" cy="680" r="260" fill="#F0A8FF"/></g>
 <path d="M178 196 L846 196 L846 330 Q520 420 178 360 Z" fill="#fff" opacity=".12"/>
</g>
